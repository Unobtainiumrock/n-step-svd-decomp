<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tone Calibration - Face ID for Tone</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            max-width: 800px;
            width: 90%;
        }
        
        .header {
            text-align: center;
            margin-bottom: 40px;
        }
        
        .header h1 {
            color: #333;
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        
        .header p {
            color: #666;
            font-size: 1.1em;
        }
        
        .progress-bar {
            width: 100%;
            height: 8px;
            background: #f0f0f0;
            border-radius: 4px;
            margin: 30px 0;
            overflow: hidden;
        }
        
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea, #764ba2);
            border-radius: 4px;
            transition: width 0.3s ease;
            width: 0%;
        }
        
        .status {
            text-align: center;
            margin-bottom: 30px;
            color: #666;
        }
        
        .comparison {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-bottom: 30px;
        }
        
        .content-option {
            border: 2px solid #e0e0e0;
            border-radius: 15px;
            padding: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
            background: #fafafa;
        }
        
        .content-option:hover {
            border-color: #667eea;
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }
        
        .content-option.selected {
            border-color: #667eea;
            background: #f0f4ff;
        }
        
        .option-label {
            font-weight: bold;
            color: #667eea;
            margin-bottom: 15px;
            font-size: 1.1em;
        }
        
        .content-text {
            color: #333;
            line-height: 1.6;
            font-size: 0.95em;
        }
        
        .controls {
            text-align: center;
            margin-top: 30px;
        }
        
        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 40px;
            border-radius: 25px;
            font-size: 1.1em;
            cursor: pointer;
            transition: all 0.3s ease;
            margin: 0 10px;
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }
        
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        
        .btn-secondary {
            background: #f0f0f0;
            color: #333;
        }
        
        .completed {
            text-align: center;
            padding: 40px;
        }
        
        .completed h2 {
            color: #667eea;
            font-size: 2em;
            margin-bottom: 20px;
        }
        
        .completed p {
            color: #666;
            font-size: 1.1em;
            margin-bottom: 30px;
        }
        
        .confidence-score {
            font-size: 3em;
            font-weight: bold;
            color: #667eea;
            margin: 20px 0;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
        }
        
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .error {
            background: #ffebee;
            color: #c62828;
            padding: 15px;
            border-radius: 10px;
            margin: 20px 0;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎵 Tone Calibration</h1>
            <p>Help us learn your content preferences</p>
        </div>
        
        <div id="loading" class="loading">
            <div class="spinner"></div>
            <p>Initializing your tone calibration...</p>
        </div>
        
        <div id="calibration" style="display: none;">
            <div class="progress-bar">
                <div class="progress-fill" id="progress"></div>
            </div>
            
            <div class="status" id="status">
                Choose the content that better matches your preferred tone
            </div>
            
            <div class="comparison" id="comparison">
                <!-- Content options will be loaded here -->
            </div>
            
            <div class="controls">
                <button class="btn btn-secondary" onclick="skipPair()">Skip This Pair</button>
                <button class="btn" id="nextBtn" onclick="nextPair()" disabled>Next Comparison</button>
            </div>
        </div>
        
        <div id="completed" class="completed" style="display: none;">
            <h2>🎉 Calibration Complete!</h2>
            <p>Your tone preferences have been successfully learned</p>
            <div class="confidence-score" id="finalConfidence">95%</div>
            <p>Confidence Score</p>
            <button class="btn" onclick="testScoring()">Test Content Scoring</button>
        </div>
        
        <div id="error" class="error" style="display: none;"></div>
    </div>

    <script>
        let currentPair = null;
        let selectedContent = null;
        let choicesMade = 0;
        const API_BASE = 'http://localhost:8000';
        
        // Initialize calibration
        async function initializeCalibration() {
            try {
                // Start calibration session
                await fetch(`${API_BASE}/calibration/start`, { method: 'POST' });
                
                // Load first pair
                await loadNextPair();
                
                document.getElementById('loading').style.display = 'none';
                document.getElementById('calibration').style.display = 'block';
                
            } catch (error) {
                showError('Failed to initialize calibration: ' + error.message);
            }
        }
        
        // Load next content pair
        async function loadNextPair() {
            try {
                const response = await fetch(`${API_BASE}/calibration/next-pair`);
                
                if (!response.ok) {
                    if (response.status === 400) {
                        // User is calibrated
                        showCompleted();
                        return;
                    }
                    throw new Error(`HTTP ${response.status}`);
                }
                
                currentPair = await response.json();
                displayPair(currentPair);
                updateProgress(currentPair.calibration_progress);
                
            } catch (error) {
                showError('Failed to load content pair: ' + error.message);
            }
        }
        
        // Display content pair
        function displayPair(pair) {
            const comparison = document.getElementById('comparison');
            comparison.innerHTML = `
                <div class="content-option" onclick="selectContent('${pair.content_a.id}', this)">
                    <div class="option-label">Option A</div>
                    <div class="content-text">${pair.content_a.text}</div>
                </div>
                <div class="content-option" onclick="selectContent('${pair.content_b.id}', this)">
                    <div class="option-label">Option B</div>
                    <div class="content-text">${pair.content_b.text}</div>
                </div>
            `;
            
            selectedContent = null;
            document.getElementById('nextBtn').disabled = true;
            
            // Update status
            const status = document.getElementById('status');
            status.textContent = `Comparison ${pair.choices_made + 1} • Strategy: ${pair.strategy_used}`;
        }
        
        // Select content option
        function selectContent(contentId, element) {
            // Remove previous selection
            document.querySelectorAll('.content-option').forEach(el => {
                el.classList.remove('selected');
            });
            
            // Select current option
            element.classList.add('selected');
            selectedContent = contentId;
            document.getElementById('nextBtn').disabled = false;
        }
        
        // Record choice and load next pair
        async function nextPair() {
            if (!selectedContent || !currentPair) return;
            
            try {
                // Record choice
                const response = await fetch(`${API_BASE}/calibration/record-choice`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        pair_id: currentPair.pair_id,
                        chosen_content_id: selectedContent,
                        confidence: 1.0
                    })
                });
                
                const result = await response.json();
                choicesMade = result.choices_made;
                
                if (result.is_calibrated) {
                    showCompleted();
                } else {
                    await loadNextPair();
                }
                
            } catch (error) {
                showError('Failed to record choice: ' + error.message);
            }
        }
        
        // Skip current pair
        async function skipPair() {
            await loadNextPair();
        }
        
        // Update progress bar
        function updateProgress(percentage) {
            const progressFill = document.getElementById('progress');
            progressFill.style.width = percentage + '%';
        }
        
        // Show completion screen
        async function showCompleted() {
            try {
                const response = await fetch(`${API_BASE}/calibration/status`);
                const status = await response.json();
                
                document.getElementById('calibration').style.display = 'none';
                document.getElementById('completed').style.display = 'block';
                
                const confidence = Math.round(status.calibration_confidence * 100);
                document.getElementById('finalConfidence').textContent = confidence + '%';
                
            } catch (error) {
                showError('Failed to get final status: ' + error.message);
            }
        }
        
        // Test content scoring
        async function testScoring() {
            try {
                const response = await fetch(`${API_BASE}/content/score`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        content_text: "This is a test piece of content to score"
                    })
                });
                
                const result = await response.json();
                alert(`Content Score: ${result.tone_score.toFixed(3)}\nConfidence: ${Math.round(result.confidence * 100)}%`);
                
            } catch (error) {
                showError('Failed to score content: ' + error.message);
            }
        }
        
        // Show error message
        function showError(message) {
            const errorDiv = document.getElementById('error');
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
            
            document.getElementById('loading').style.display = 'none';
            document.getElementById('calibration').style.display = 'none';
        }
        
        // Initialize when page loads
        window.addEventListener('load', initializeCalibration);
    </script>
</body>
</html>
